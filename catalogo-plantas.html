<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo de plantas para aquário com filtros por dificuldade, CO2, iluminação, substrato e parâmetros de água." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#0f8ea6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AquaristaPRO" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="canonical" href="https://aquaristapro.com/catalogo-plantas.html" />
  <title>Catálogo de plantas | AquaristaPRO</title>
  <link rel="icon" href="images/logo-64.ico" sizes="64x64" type="image/x-icon" />
  <link rel="icon" href="images/logo-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-supabase-url="https://xktobjguguvvoagyteke.supabase.co" data-supabase-anon-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrdG9iamd1Z3V2dm9hZ3l0ZWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzczMDIsImV4cCI6MjEwMTk1MzMwMn0.TtraDjiNvNra7-aUtbDQUeVSfZAMACFBG4lakZ6dRD4">
  <nav id="site-nav" class="top-nav" aria-label="Navegação principal"></nav>

  <header class="hero hero-small hero-plants-catalog">
    <div class="hero-content">
      <p class="eyebrow">AquaristaPRO</p>
      <h1>Encontre plantas compatíveis com o seu aquário</h1>
    </div>
  </header>

  <main class="page-shell catalog-layout">
    <aside class="card filters-card" id="catalogFilters">
      <div class="filters-card-header">
        <h2>Filtros</h2>
        <button id="closeFiltersButton" type="button" class="filters-close-btn" aria-label="Fechar filtros">&times;</button>
      </div>

      <section class="plant-quick-filter" aria-label="Filtro rápido low-tech">
        <button id="lowTechToggle" type="button" class="plant-quick-toggle" aria-pressed="false">Apenas Low-Tech</button>
      </section>

      <form id="filtersForm" class="filter-form">
        <div class="filter-form-actions filter-form-actions-top">
          <button type="submit">Aplicar filtros</button>
          <button type="reset" class="filter-form-reset">Limpar filtros</button>
        </div>
        <label>Busca
          <input type="text" name="search" placeholder="Nome, uso, família ou descrição" />
        </label>
        <label>Nível de dificuldade
          <select name="difficulty"></select>
        </label>
        <label>Posição indicada
          <select name="placement"></select>
        </label>
        <label>Taxa de crescimento
          <select name="growthRate"></select>
        </label>
        <label>Iluminação
          <select name="light"></select>
        </label>
        <label>CO2
          <select name="co2"></select>
        </label>
        <label>Substrato fértil
          <select name="substrate"></select>
        </label>
        <label>Dureza da água
          <select name="waterHardness"></select>
        </label>
        <label>pH mínimo
          <input type="number" name="phMin" step="0.1" />
        </label>
        <label>pH máximo
          <input type="number" name="phMax" step="0.1" />
        </label>
        <label>Temperatura mínima
          <input type="number" name="tempMin" step="0.1" />
        </label>
        <label>Temperatura máxima
          <input type="number" name="tempMax" step="0.1" />
        </label>
        <div class="filter-form-actions filter-form-actions-bottom">
          <button type="submit">Aplicar filtros</button>
          <button type="reset" class="filter-form-reset">Limpar filtros</button>
        </div>
      </form>
    </aside>

    <div id="filtersBackdrop" class="filters-backdrop hidden" aria-hidden="true"></div>

    <section class="catalog-results plant-catalog-results">
      <div class="catalog-results-header card">
        <div class="catalog-results-intro">
          <p class="eyebrow">Catálogos / Plantas</p>
          <h2>Seleção técnica baseada nas fichas</h2>
          <p id="plantCatalogSummary">Carregando catálogo de plantas...</p>
        </div>
      </div>

      <div id="plantCards" class="fish-grid plant-grid"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 AquaristaPRO — conteúdo educativo para aquarismo de água doce.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
