<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Playground - AquaristaPRO</title>
  <style>
    :root {
      --bg: #eef9fc;
      --panel: #ffffff;
      --ink: #12313f;
      --muted: #5b7380;
      --line: #d7ebf2;
      --primary: #0b7a8a;
      --primary-dark: #085469;
      --accent: #8ad8e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, rgba(138, 216, 231, 0.45), transparent 40%),
        linear-gradient(180deg, #f7fdff 0%, #edf9fb 100%);
    }

    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 3.2vw, 2.1rem);
      color: var(--primary-dark);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .grid {
      margin-top: 18px;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 26px rgba(10, 50, 65, 0.1);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      color: var(--primary-dark);
    }

    .preview {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #f9feff;
      overflow: hidden;
    }

    .preview.dark {
      background: linear-gradient(135deg, #0f8ea6 0%, #7bd3e6 100%);
    }


  </style>
</head>
<body>
  <div class="wrap">
    <h1>Logo SVG independente para revisao</h1>
    <p>Arquivo totalmente isolado. Edite os caminhos SVG aqui, sem alterar o site. Quando aprovar o desenho, exportamos para os arquivos finais.</p>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <linearGradient id="gradBadge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0f8ea6" />
          <stop offset="100%" stop-color="#7bd3e6" />
        </linearGradient>
        <linearGradient id="gradWord" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0b7a8a" />
          <stop offset="100%" stop-color="#0e5f74" />
        </linearGradient>

        <symbol id="ap-wordmark" viewBox="0 0 620 220">
          <g transform="translate(20, 0)">
            <text x="0" y="104" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="74" font-weight="700" fill="url(#gradWord)">Aquarista</text>
            <text x="336" y="104" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#085469">PRO</text>
            <text x="2" y="144" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="2" fill="#4b7280">AQUARISMO PROFISSIONAL</text>
            <path d="M2 164 C120 146, 240 176, 360 160 C430 150, 490 164, 565 156"
                  fill="none" stroke="#8ad8e7" stroke-width="6" stroke-linecap="round" opacity="0.88" />
          </g>
        </symbol>
      </defs>
    </svg>

    <div class="grid">
      <section class="card">
        <h2>Wordmark principal (fundo claro)</h2>
        <div class="preview">
          <svg viewBox="0 0 620 220" width="100%" role="img" aria-label="Wordmark AquaristaPRO">
            <use href="#ap-wordmark" />
          </svg>
        </div>
      </section>

      <section class="card">
        <h2>Wordmark em fundo de hero</h2>
        <div class="preview dark">
          <svg viewBox="0 0 620 220" width="100%" role="img" aria-label="Wordmark AquaristaPRO sobre gradiente">
            <use href="#ap-wordmark" />
          </svg>
        </div>
      </section>

    </div>
  </div>
</body>
</html>
