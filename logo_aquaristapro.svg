    <path d="M 214 575 C 281 536 344 550 405 565 C 465 579 516 577 569 551" stroke-width="8"/>

    <path d="M 313 497 C 283 461 262 430 258 422 C 290 432 316 455 341 515" stroke-width="9"/>
    <path d="M 378 524 C 355 474 366 410 398 348 C 423 394 422 462 392 526" stroke-width="10"/>
    <path d="M 446 499 C 477 460 511 435 552 429 C 536 468 499 498 449 518" stroke-width="9"/>

    <path d="M 330 504 C 311 476 297 454 289 444" stroke-width="5"/>
    <path d="M 386 520 C 384 471 389 418 395 368" stroke-width="5"/>
    <path d="M 441 510 C 466 480 487 461 515 444" stroke-width="5"/>

    <path d="M 312 324 C 348 303 407 304 461 331" stroke-width="12"/>
    <path d="M 226 386 C 249 348 301 324 362 323 C 448 322 513 362 556 433" stroke-width="12"/>
    <path d="M 222 385 C 194 352 171 333 144 321 C 151 357 176 392 223 432" stroke-width="12"/>
    <path d="M 312 325 C 290 294 266 278 228 266 C 238 301 266 330 299 347" stroke-width="12"/>
    <path d="M 462 331 C 512 343 554 377 588 433 C 569 457 545 478 519 494" stroke-width="12"/>
    <path d="M 522 394 C 541 378 554 359 563 338" stroke-width="5"/>
    <circle cx="502" cy="385" r="10" fill="url(#silverFill)" stroke-width="4"/>
  </g>

  <text font-family="Poppins, Montserrat, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="url(#silverFill)" letter-spacing="0.15" filter="url(#softShadow)">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">Tudo sobre aquário de água doce</textPath>
  </text>

  <circle cx="380" cy="380" r="345" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.62"/>
</svg>