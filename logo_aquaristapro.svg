    <text x="380" y="176" text-anchor="middle" font-family="Poppins, Montserrat, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="url(#silverFill)" stroke="none">AquaristaPRO</text>

    <path d="M 104 232 A 292 292 0 0 0 108 420" stroke-width="11"/>
    <path d="M 160 230 A 240 240 0 0 0 165 555" stroke-width="9"/>
    <path d="M 656 232 A 292 292 0 0 1 652 420" stroke-width="11"/>
