<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Logo AquaristaPRO</title>
  <desc id="desc">Selo circular azul com borda metálica, texto AquaristaPRO, ilustração de peixe com plantas e o texto Tudo sobre aquário de água doce.</desc>
  <defs>
    <radialGradient id="badgeFill" cx="33%" cy="20%" r="78%">
      <stop offset="0%" stop-color="#d8f6fb"/>
      <stop offset="18%" stop-color="#8cd5df"/>
      <stop offset="58%" stop-color="#359ab0"/>
      <stop offset="100%" stop-color="#1f7087"/>
    </radialGradient>
    <radialGradient id="badgeGlow" cx="38%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#d9dfe3"/>
      <stop offset="40%" stop-color="#fafafa"/>
      <stop offset="68%" stop-color="#9ca7ae"/>
      <stop offset="100%" stop-color="#eef2f4"/>
    </linearGradient>
    <linearGradient id="silverFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce1e5"/>
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#0b2931" flood-opacity="0.28"/>
    </filter>
    <filter id="innerBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#ffffff" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="2.4" flood-color="#36545d" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2.6" dy="4.5" stdDeviation="3.2" flood-color="#102830" flood-opacity="0.3"/>
    </filter>
    <path id="bottomArc" d="M 146 447 A 233 233 0 0 0 614 447" fill="none"/>
  </defs>

  <g filter="url(#badgeShadow)">
    <circle cx="380" cy="380" r="345" fill="url(#silverStroke)"/>
    <circle cx="380" cy="380" r="330" fill="none" stroke="#8fa2aa" stroke-width="4" opacity="0.75"/>
    <circle cx="380" cy="380" r="318" fill="url(#badgeFill)"/>
    <circle cx="380" cy="380" r="314" fill="none" stroke="#5c9dae" stroke-width="3" opacity="0.95"/>
    <ellipse cx="310" cy="170" rx="220" ry="115" fill="url(#badgeGlow)" opacity="0.7"/>
    <path d="M 85 270 C 145 105 300 56 398 58 C 520 60 630 128 680 228 C 630 192 573 164 468 152 C 325 135 207 164 85 270 Z" fill="#ffffff" opacity="0.17"/>
  </g>

